plugins {
    id 'java'
    id 'application'
    id 'com.gradleup.shadow' version '8.3.7'
}
import org.objectweb.asm.*

repositories {
    mavenCentral()
}
// Disable the default jar task since we want to use shadowJar fat jar only
tasks.named('jar') {
    enabled = false
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()

    maven {
        url "https://securosys.jfrog.io/artifactory/jce-maven"
        credentials {
            username = System.getenv("SECUROSYS_ARTIFACTORY_USER") ?: project.findProperty("com.securosys.artifactory_user")
            password = System.getenv("SECUROSYS_ARTIFACTORY_PASSWORD") ?: project.findProperty("com.securosys.artifactory_password")
        }
        // https://docs.gradle.org/current/userguide/filtering_repository_content.html
        content {
            includeGroup "com.securosys"
        }
    }
}

dependencies {
    // https://mvnrepository.com/artifact/org.apache.commons/commons-lang3
    implementation group: 'org.apache.commons', name: 'commons-lang3', version: '3.17.0'

    // https://mvnrepository.com/artifact/org.slf4j/slf4j-api
    implementation group: 'org.slf4j', name: 'slf4j-api', version: '2.0.16'

    // https://mvnrepository.com/artifact/commons-codec/commons-codec
    implementation group: 'commons-codec', name: 'commons-codec', version: '1.18.0'

    // https://mvnrepository.com/artifact/com.fasterxml.jackson.dataformat/jackson-dataformat-xml
    implementation group: 'com.fasterxml.jackson.dataformat', name: 'jackson-dataformat-xml', version: '2.18.2'

    // https://mvnrepository.com/artifact/jakarta.validation/jakarta.validation-api
    implementation group: 'jakarta.validation', name: 'jakarta.validation-api', version: '3.1.0'

    // https://mvnrepository.com/artifact/jakarta.annotation/jakarta.annotation-api
    implementation group: 'jakarta.annotation', name: 'jakarta.annotation-api', version: '3.0.0'

    // https://mvnrepository.com/artifact/io.swagger.core.v3/swagger-annotations
    implementation group: 'io.swagger.core.v3', name: 'swagger-annotations', version: '2.2.28'
    // Lombok
    compileOnly 'org.projectlombok:lombok:1.18.30' // Use the latest version
    annotationProcessor 'org.projectlombok:lombok:1.18.30'
    // https://mvnrepository.com/artifact/com.fasterxml.jackson.core/jackson-databind
    implementation group: 'com.fasterxml.jackson.core', name: 'jackson-databind', version: '2.18.2'
    // Dependency for JUnit testing
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.0'
    implementation 'org.mariadb.jdbc:mariadb-java-client:3.5.4'
    // https://mvnrepository.com/artifact/org.postgresql/postgresql
    implementation 'org.postgresql:postgresql:42.7.7'
    implementation 'com.h2database:h2:2.2.220'
    implementation 'org.ow2.asm:asm:9.7'
    implementation 'com.securosys:primus-jce:2.5.4'



}

def findMainClasses = {
    def classDir = layout.buildDirectory.dir("classes/java/main").get().asFile
    def mainClasses = []

    fileTree(dir: classDir, include: '**/*.class').visit { FileVisitDetails fvd ->
        if (!fvd.file.isFile()) return

        def relativePath = fvd.relativePath.pathString
        if (relativePath.contains('$')) return // Skip inner classes

        def className = relativePath
                .replaceAll(/\.class$/, '')
                .replace('/', '.')

        def reader = new ClassReader(fvd.file.bytes)
        def hasMain = false

        reader.accept(new ClassVisitor(Opcodes.ASM9) {
            @Override
            MethodVisitor visitMethod(int access, String name, String descriptor, String signature, String[] exceptions) {
                if (
                        name == 'main' &&
                                descriptor == '([Ljava/lang/String;)V' &&
                                (access & Opcodes.ACC_PUBLIC) &&
                                (access & Opcodes.ACC_STATIC)
                ) {
                    hasMain = true
                }
                return null
            }
        }, 0)

        if (hasMain) {
            mainClasses << className
        }
    }

    return mainClasses
}

def findMainClassesInSources = {
    def mainMethodPattern = ~/(?s)\bpublic\s+static\s+void\s+main\s*\(\s*String\s*(?:\[\s*\]|\.\.\.)/
    def packagePattern = /(?m)^\s*package\s+([\w.]+)\s*;/
    def mainClasses = []

    fileTree('src/main/java').matching { include '**/*.java' }.each { File sourceFile ->
        def source = sourceFile.getText('UTF-8')
        if (source =~ mainMethodPattern) {
            def packageMatcher = source =~ packagePattern
            def packageName = packageMatcher.find() ? packageMatcher.group(1) : ''
            def className = sourceFile.name - '.java'
            mainClasses << (packageName ? "${packageName}.${className}".toString() : className)
        }
    }

    return mainClasses
}

application {
    mainClass = 'com.securosys.tee.RunJarExecutable'
}



tasks.test {
    useJUnitPlatform()
}

tasks.withType(com.github.jengelman.gradle.plugins.shadow.tasks.ShadowJar).configureEach {
    exclude 'META-INF/*.SF'
    exclude 'META-INF/*.DSA'
    exclude 'META-INF/*.RSA'
    exclude 'META-INF/*.EC'
}


def sourceMainClasses = findMainClassesInSources()
def requestedMainClass = System.getenv('MAIN') ?: (project.hasProperty('main') ? project.property('main') : application.mainClass.get())
def selectedMainClass = sourceMainClasses.find {
    it == requestedMainClass || it.endsWith(".${requestedMainClass}")
} ?: requestedMainClass
application.mainClass = selectedMainClass

shadowJar {
        inputs.property("forceRebuild", System.currentTimeMillis())
        dependsOn tasks.named('classes')
        archiveBaseName.set(selectedMainClass.tokenize('.').last())
        archiveClassifier.set('')
        archiveVersion.set('')
        manifest {
            attributes 'Main-Class': selectedMainClass
        }
        doFirst {
            manifest.attributes.put('Main-Class', selectedMainClass)
            def compiledMainClasses = findMainClasses()
            if (!compiledMainClasses.contains(selectedMainClass)) {
                throw new GradleException("❌ Main class not found: '${selectedMainClass}'. Available main classes: ${compiledMainClasses}")
            }

            println "✅ Building fat JAR for: ${selectedMainClass}"
        }

        from(sourceSets.main.output)
        configurations = [project.configurations.runtimeClasspath]
}


// Make startScripts use the shadowJar fat jar instead of the normal jar
tasks.named('startScripts') {
    dependsOn tasks.named('shadowJar')
    doFirst {
        classpath = files(tasks.named('shadowJar').get().archiveFile)
    }
}

// Make assemble and build depend on shadowJar fat jar
tasks.named('assemble') {
    dependsOn tasks.named('shadowJar')
}

tasks.named('build') {
    dependsOn tasks.named('shadowJar')
}
def mainClasses = sourceMainClasses


mainClasses.each { mainClassName ->
    def shortName = mainClassName.tokenize('.').last()
    tasks.register("shadowJar${shortName}", com.github.jengelman.gradle.plugins.shadow.tasks.ShadowJar) {
        group = 'build'
        description = "Creates a fat jar for ${mainClassName}"
        archiveBaseName.set(shortName)
        archiveClassifier.set('')
        archiveVersion.set('')
        from(sourceSets.main.output)
        configurations = [project.configurations.runtimeClasspath]
        manifest {
            attributes 'Main-Class': mainClassName
        }
    }
}

tasks.register("buildAll") {
    group = 'build'
    description = 'Builds all jars for all main classes'
    dependsOn(classes)
    dependsOn mainClasses.collect { mainClassName ->
        def shortName = mainClassName.tokenize('.').last()
        tasks.named("shadowJar${shortName}")
    }
}
